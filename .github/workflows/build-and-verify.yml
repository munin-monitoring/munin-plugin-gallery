---
name: Build and Verify

on:
  push: null
  schedule:
    - cron: "12 3 * * *"
  workflow_dispatch:

jobs:
  build-und-verify:
    name: Build and Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: True
      - name: Install dependencies
        run: sudo apt-get install --yes --quiet codespell git jq libpod-markdown-perl make perl-doc python3-aiohttp python3-flake8 python3-yaml wget
      - name: Install hugo 0.131.0
        run: wget --no-verbose https://github.com/gohugoio/hugo/releases/download/v0.131.0/hugo_extended_0.131.0_linux-amd64.deb && sudo dpkg -i hugo_extended_0.131.0_linux-amd64.deb
      - name: Build website
        run: make build
      - name: Analyze the code and spelling
        run: make lint
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: hugo-base/public
